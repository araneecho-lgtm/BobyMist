<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* ส่วนเฉพาะหน้า admin (เสริมจาก style.css) */
    .table-wrap {
      overflow-x: auto;
      border: var(--border);
      background: var(--color-white);
    }

    #ordersTable {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--text-sm);
    }

    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2) var(--space-3);
      border-bottom: var(--border);
      text-align: left;
      vertical-align: top;
    }

    #ordersTable th {
      background: var(--color-cream);
      color: var(--color-ink);
      font-family: var(--font-serif-th);
      font-weight: 500;
      white-space: nowrap;
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable td:nth-child(1),
    #ordersTable td:nth-child(5) {
      white-space: nowrap;
    }

    /* มือถือ: แต่ละรายการเรียงเป็นบล็อก ใช้ data-label ที่ script.js ใส่ไว้ */
    @media (max-width: 48rem) {
      .table-wrap {
        overflow-x: visible;
        border: 0;
        background: transparent;
      }

      #ordersTable,
      #ordersTable tbody,
      #ordersTable tr,
      #ordersTable td {
        display: block;
        width: 100%;
      }

      #ordersTable thead {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      #ordersTable tbody tr {
        margin-bottom: var(--space-3);
        border: var(--border);
        background: var(--color-white);
      }

      #ordersTable td {
        padding: var(--space-1) var(--space-2);
        border-bottom: 0;
      }

      #ordersTable td[data-label]::before {
        content: attr(data-label);
        display: block;
        font-size: var(--text-xs);
        color: var(--color-beige-deep);
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section section--cream">
      <div class="container text-center">
        <h1>รายการสั่งซื้อ</h1>
        <hr class="divider">
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <a class="brand" href="index.html">Body Scent</a>
      <p>&copy; 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
