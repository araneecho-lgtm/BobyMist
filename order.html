<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — Body Scent</title>
  <meta name="description" content="กรอกรายละเอียดเพื่อสั่งซื้อน้ำหอมฉีดตัวและโรลออน Body Scent">
  <link rel="stylesheet" href="style.css">

  <style>
    /* ส่วนเฉพาะหน้าสั่งซื้อ (เสริมจาก style.css) */
    .order-form {
      display: grid;
      gap: var(--space-3);
    }

    .field label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: var(--text-sm);
      color: var(--color-ink-soft);
    }

    .field .optional {
      color: var(--color-beige-deep);
    }

    .field textarea {
      resize: vertical;
      line-height: 1.7;
    }

    .order-form .btn {
      margin-top: var(--space-2);
    }

    .order-back {
      margin: var(--space-3) 0 0;
      font-size: var(--text-sm);
      text-align: center;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section section--cream">
      <div class="container text-center">
        <h1>สั่งซื้อสินค้า</h1>
        <hr class="divider">
      </div>
    </section>

    <section class="section">
      <div class="container container--narrow">
        <form id="orderForm" class="order-form">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="off" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" inputmode="numeric" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ <span class="optional">(ไม่บังคับ)</span></label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>
        </form>

        <p class="order-back"><a href="product.html">กลับไปเลือกสินค้า</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <a class="brand" href="index.html">Body Scent</a>
      <p>&copy; 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
